plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'com.syaru.crazycapacity'
version = '0.1.1'
base { archivesName = 'crazy-capacity-bridge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }

def modsDir = file(findProperty('modsDir') ?: 'libs')
def bridgeLibs = file('.compile-mods')
bridgeLibs.mkdirs()
copy {
    from fileTree(modsDir) { include 'aco*.jar' }
    into bridgeLibs
    rename { 'aco-2.0.0.jar' }
}
java { withSourcesJar() }
repositories {
    mavenCentral()
    flatDir { dirs modsDir, bridgeLibs }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation fg.deobf(group: 'local', name: 'appliedenergistics2-forge', version: '15.4.10')
    implementation fg.deobf(group: 'local', name: 'CrazyAE-1.20.1', version: 'v1.0')
    implementation fg.deobf(group: 'local', name: 'aco', version: '2.0.0')
    compileOnly 'org.spongepowered:mixin:0.8.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
tasks.named('jar') {
    from('LICENSE')
    manifest { attributes 'MixinConfigs': 'crazy_capacity_bridge.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'bridge.modsDir', modsDir.absolutePath
}
