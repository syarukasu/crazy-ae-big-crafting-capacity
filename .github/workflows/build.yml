name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  forge-1201:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch checksum-pinned public dependencies
        shell: pwsh
        run: ./scripts/fetch-dependencies.ps1
      - name: Build
        shell: pwsh
        run: ./gradlew.bat build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: crazy-capacity-bridge-forge-1201
          path: build/libs/*.jar
